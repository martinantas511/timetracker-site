name: Keep Supabase project alive

# Shared Supabase project for TimeTracker, BudgetTracker and HabitTracker.
# Free tier pauses a project after 7 days without activity; a paused project
# takes all three apps down (login + data). This job queries the database every
# 2 days, restores the project via the Management API if it ever is paused, and
# fails loudly (GitHub emails you) when the project cannot be reached.

on:
  schedule:
    - cron: '0 6 */2 * *'   # every 2 days, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write           # heartbeat commit, see last step

env:
  SUPABASE_URL: https://xitkovwkcsaqsejjesep.supabase.co
  PROJECT_REF: xitkovwkcsaqsejjesep
  # Publishable key: public by design (shipped inside the apps), access is
  # enforced by RLS. Safe to keep here.
  SUPABASE_KEY: sb_publishable_AAXndODMMcUkHGnZlcSPIg_gnCNl7VI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query the database (counts as project activity)
        id: ping
        run: |
          ping_db() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY"
          }
          CODE=$(ping_db)
          echo "DB query status: $CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore project if it is paused
        if: steps.ping.outputs.code != '200'
        env:
          # Optional repo secret: a Supabase personal access token.
          # Secrets cannot be used in `if:` expressions, so it is checked here.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN secret set - cannot auto-restore."
            exit 0
          fi
          echo "Project not responding - requesting restore..."
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          echo
          for i in $(seq 1 20); do
            sleep 30
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
            echo "attempt $i: $CODE"
            [ "$CODE" = "200" ] && break
          done

      - name: Verify project is alive
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Final DB query status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase project is NOT reachable ($CODE) - TT/BT/HT are down."
            exit 1
          fi
          echo "OK - project is alive."

      - name: Heartbeat commit (stops GitHub disabling this schedule)
        # GitHub disables scheduled workflows after 60 days without repo
        # activity. Refresh a small file at most once every ~30 days.
        run: |
          F=.github/keepalive-heartbeat
          LAST=$(cat "$F" 2>/dev/null || echo 0)
          NOW=$(date +%s)
          if [ $((NOW - LAST)) -lt 2592000 ]; then
            echo "Heartbeat is fresh - nothing to commit."
            exit 0
          fi
          echo "$NOW" > "$F"
          git config user.name  "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add "$F"
          git commit -m "chore: keep-alive heartbeat [skip ci]"
          git push
